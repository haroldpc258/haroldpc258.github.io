<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t">
  <title id="t">Patrón Dosenta</title>
  <defs>
    <pattern id="dosenta-pattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="120" height="120" fill="#F2F8F8"/>
      <!-- Motivo 1: cápsula pequeña -->
      <g opacity="0.5">
        <path d="M20 20a5 5 0 0 1 10 0v12H20z" fill="#6FE3C8"/>
        <path d="M20 32h10v12a5 5 0 0 1-10 0z" fill="#11A8A0"/>
      </g>
      <!-- Motivo 2: arco -->
      <path d="M70 14a18 18 0 0 1 0 36" fill="none" stroke="#11A8A0" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
      <!-- Motivo 3: gota -->
      <path d="M96 70c0 0-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z" fill="#FF6F61" opacity="0.25"/>
      <!-- Motivo 4: cápsula pequeña (repetida, offset) -->
      <g opacity="0.4">
        <path d="M40 80a5 5 0 0 1 10 0v12H40z" fill="#11A8A0"/>
        <path d="M40 92h10v12a5 5 0 0 1-10 0z" fill="#6FE3C8"/>
      </g>
      <!-- Motivo 5: arco pequeño -->
      <path d="M8 96a12 12 0 0 1 0 24" fill="none" stroke="#6FE3C8" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="480" height="360" fill="url(#dosenta-pattern)"/>
</svg>
